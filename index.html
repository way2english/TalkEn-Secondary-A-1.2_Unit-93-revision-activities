{id:'gr',name:'💡 should & Imperatives',intro:'<p><b>should + дієслово</b> — гарна ідея, порада: <i>You should stay in bed.</i> <b>shouldn\'t + дієслово</b> — погана ідея: <i>Tom shouldn\'t eat sweets.</i></p><p>🧠 Лайфхак: після should / shouldn\'t дієслово завжди в початковій формі БЕЗ to (should visit, а не should to visit)!</p><p><b>Наказовий спосіб:</b> починай прямо з дієслова — <i>Cover your mouth!</i> Для заборони став <b>Don\'t</b> на початку — <i>Don\'t drink cold water!</i></p><p>🧠 Лайфхак: ніяких you чи must — просто дієслово, а для заборони Don\'t.</p>',ex:['g3','g4','g5']},
{id:'vocab',name:'🧩 Vocabulary',intro:'<p>to take medicine — приймати ліки · to take temperature — міряти температуру · to stay in bed — лежати в ліжку · to take a nap — подрімати · a bruise — синець · a cut — поріз · a scratch — подряпина · to catch a virus — підхопити вірус · to sanitise your hands — дезінфікувати руки · to wear a mask — носити маску · a band-aid — лейкопластир · to get stuck — застрягнути · a runny nose — нежить · to sneeze — чхати · to cough — кашляти · to cover — прикривати · earache — біль у вусі · toothache — зубний біль · headache — головний біль · backache — біль у спині · a fever — висока температура · prescription — рецепт · pharmacy — аптека · get well — одужувати</p>',ex:['v1']},
{id:'phr',name:'💬 Phrases',intro:'<p>🔵 <b>Спитати про здоров\'я:</b> What\'s the matter? · What\'s wrong? · How do you feel? · What happened?</p><p>🟠 <b>Описати симптоми:</b> I have a runny nose. · My back hurts. · I\'ve got an earache. · I caught a virus.</p><p>🟢 <b>Порадити:</b> You should stay in bed. · Take this medicine twice a day. · Here\'s your prescription. · Get well soon!</p>',ex:['f2']},
{id:'speak',name:'🎤 Speaking',intro:'<p>Працюй у парі. Усі завдання подано українською, а розмовляти треба англійською. Виконали завдання разом — познач галочку й отримай бали. Макро-сценарії й дискусії в кінці — без балів, для практики.</p>',ex:[]}

const EX={

const SP=[
{id:'s0',t:'🤒 Картка 1: Застуда',a:'<b>Ситуація:</b> учень A почувається погано після гри надворі взимку.<br><b>Учень A:</b> розкажи B про симптоми (кашель, нежить) і спитай, що тобі робити.',b:'<b>Учень B:</b> порадь лежати в ліжку, пити теплий чай і подрімати.<br><i>Готово, коли: обидва питають і дають поради зі should та щонайменше двома словами-симптомами.</i>',ph:'«нежить» · «кашель» · «лежати в ліжку» · «тобі слід…» · «подрімати»'},
{id:'s1',t:'🏥 Картка 2: У лікаря',a:'<b>Ситуація:</b> учень B прийшов до лікаря (учень A) з високою температурою.<br><b>Учень A (лікар):</b> спитай, що сталось, виміряй температуру й випиши рецепт.',b:'<b>Учень B:</b> поясни, коли почались симптоми, і спитай, чи потрібні ліки.<br><i>Готово, коли: A виміряв(-ла) температуру й дав(-ла) рецепт, а B описав(-ла) симптоми.</i>',ph:'«що сталось?» · «міряти температуру» · «рецепт» · «аптека» · «ліки»'},
{id:'s2',t:'🤕 Картка 3: Спортивна травма',a:'<b>Ситуація:</b> учень A впав на уроці фізкультури й забив коліно.<br><b>Учень A:</b> покажи травму B і поясни, як це сталось.',b:'<b>Учень B:</b> перевір, чи немає порізів чи синців, і наклей лейкопластир.<br><i>Готово, коли: A розповів(-ла), як сталась травма, а B порадив(-ла) догляд.</i>',ph:'«впасти» · «синець» · «поріз» · «лейкопластир» · «боляче»'},
{id:'s3',t:'📋 Картка 4: Правила гігієни в класі',a:'<b>Ситуація:</b> учні роблять шкільний плакат про здоров’я.<br><b>Учень A:</b> запропонуй три правила проти грипу під час пандемії (маски, антисептик).',b:'<b>Учень B:</b> додай два правила про чхання й кашель у серветку.<br><i>Готово, коли: обидва назвали щонайменше два чіткі правила в наказовому способі.</i>',ph:'«носити маску» · «дезінфікувати руки» · «чхати» · «прикривати» · «підхопити вірус»'},
{id:'s4',t:'🍳 Картка 5: Нещасний випадок на кухні',a:'<b>Ситуація:</b> учень A допомагав на кухні й порізав палець ножем.<br><b>Учень A:</b> скажи B, що палець болить, і попроси допомоги.',b:'<b>Учень B:</b> скажи промити поріз і заклеїти його лейкопластиром.<br><i>Готово, коли: A пояснив(-ла), що сталось, а B дав(-ла) негайну пораду.</i>',ph:'«поріз» · «болить» · «прикрити» · «лейкопластир» · «не…»'},
{id:'s5',t:'🤸 Картка 6: На майданчику',a:'<b>Ситуація:</b> учень B застряг на гімнастичних перекладинах.<br><b>Учень A:</b> помітив(-ла) B у біді, спитай, що сталось, і поклич на допомогу.',b:'<b>Учень B:</b> поясни, що в тебе болить рука й подряпаний лікоть.<br><i>Готово, коли: B пояснив(-ла), що застряг(-ла), а A запропонував(-ла) план дій.</i>',ph:'«застрягнути» · «гімнастичні перекладини» · «подряпина» · «боляче» · «що трапилось?»'},
{id:'s6',t:'🍬 Картка 7: Зубний біль',a:'<b>Ситуація:</b> учень A має сильний зубний біль після солодощів.<br><b>Учень A:</b> поскаржся B на зубний біль і спитай, що робити.',b:'<b>Учень B:</b> порадь піти до стоматолога й більше не їсти шоколад.<br><i>Готово, коли: A описав(-ла) біль, а B дав(-ла) дві чіткі поради.</i>',ph:'«зубний біль» · «солодощі» · «піти до стоматолога» · «тобі не слід…» · «боляче»'},
{id:'s7',t:'🐱 Картка 8: Алергія',a:'<b>Ситуація:</b> учень B починає без упину чхати поряд із котом.<br><b>Учень A:</b> спитай, чи B в порядку, і запропонуй паперову серветку.',b:'<b>Учень B:</b> поясни, що в тебе алергія на котів і треба вийти надвір.<br><i>Готово, коли: B пояснив(-ла) алергію, а A запропонував(-ла) допомогу.</i>',ph:'«чхати» · «алергія на…» · «серветка» · «що сталось?» · «вийти надвір»'},
{id:'s8',t:'💻 Картка 9: Відпочинок і відновлення',a:'<b>Ситуація:</b> учень A має головний біль після п’яти годин навчання без перерви.<br><b>Учень A:</b> скажи B, що голова болить і ти втомився(-лась).',b:'<b>Учень B:</b> порадь вимкнути комп’ютер і подрімати.<br><i>Готово, коли: A описав(-ла) втому, а B дав(-ла) поради в наказовому способі.</i>',ph:'«головний біль» · «болить» · «вимкнути» · «подрімати» · «тобі слід…»'},
{id:'s9',t:'💊 Картка 10: В аптеці',a:'<b>Ситуація:</b> учень B прийшов в аптеку по ліки для мами.<br><b>Учень A (аптекар):</b> попроси рецепт лікаря й поясни, як приймати ліки.',b:'<b>Учень B (покупець):</b> подай рецепт, заплати й побажай аптекарю гарного дня.<br><i>Готово, коли: обидва завершили покупку з лексикою аптеки.</i>',ph:'«аптека» · «рецепт» · «приймати ліки» · «двічі на день» · «одужуйте»'},
{id:'m0',np:1,t:'🏫 Макро-сценарій 1: Шкільна медсестра',a:'<b>Контекст:</b> учень B погано почувається на уроці й іде до A (шкільної медсестри).<br><b>Учень A (медсестра):</b> спитай про симптоми, виміряй температуру, огляди синці й порізи й вирішуй, чи має B іти додому.',b:'<b>Учень B:</b> поясни, що з ранку в тебе температура, головний біль і нежить.<br><i>План розмови: привітання й «що сталось?» → температура й симптоми → поради зі should / shouldn\'t → лейкопластир або записка додому.</i>',ph:'«що сталось?» · «тобі слід…» · «тобі не слід…» · «лейкопластир»'},
{id:'m1',np:1,t:'📢 Макро-сценарій 2: Кампанія з профілактики',a:'<b>Контекст:</b> учні-лідери готують інструктаж із безпеки для молодших школярів.<br><b>Учень A:</b> розкажи про правила гігієни (дезінфекція рук, миття з милом, прикривання кашлю).',b:'<b>Учень B:</b> розкажи про фізичну безпеку (дистанція, маски, залишатись вдома, коли хворий).<br><i>План розмови: тема → правила в наказовому способі → чому правила важливі → відповіді на запитання.</i>',ph:'«дезінфікуй руки!» · «носи маску!» · «не передавай вірус»'},
{id:'m2',np:1,t:'🍵 Макро-сценарій 3: Догляд за хворим другом',a:'<b>Контекст:</b> учень A навідує вдома хворого на грип учня B.<br><b>Учень A:</b> принеси чай і фрукти, спитай, як B почувається, запропонуй спокійні заняття.',b:'<b>Учень B:</b> подякуй, опиши симптоми й розкажи, що призначив лікар.<br><i>План розмови: співчуття → поради лікаря й рецепт → відпочинок → побажання одужання.</i>',ph:'«бідолашний!» · «як ти почуваєшся?» · «тобі слід подрімати» · «одужуй!»'},
{id:'d0',np:1,t:'🏠 Дискусія 1: Удома чи в школі',a:'<b>Питання:</b> чи мають учні лишатись удома навіть із легким нежитем?<br><b>Удома:</b> не заразиш клас і швидше одужаєш; день відпочинку не дасть хворобі стати серйозною.<br><b>У школі:</b> пропуски через дрібниці — відставання; маска й чисті руки достатні.<br>Що ти робиш, коли вранці прокидаєшся з нежитем? Як школа може допомогти хворим не відставати?',b:'',ph:'«залишатись удома» · «підхопити вірус» · «заразити інших» · «пропускати важливі уроки»'},
{id:'d1',np:1,t:'🍯 Дискусія 2: Народні засоби чи ліки',a:'<b>Питання:</b> що краще при застуді: чай із лимоном чи таблетки з аптеки?<br><b>Народні засоби:</b> безпечніші, без побічних ефектів; при простій застуді зміцнюють імунітет.<br><b>Аптека:</b> швидше знижує температуру й біль; рецепт лікаря дає точне лікування.<br>Який улюблений засіб у твоїй родині? Чи пив(-ла) ти ліки без поради лікаря?',b:'',ph:'«приймати ліки» · «народні засоби» · «рецепт лікаря» · «швидко одужати»'},
{id:'d2',np:1,t:'😷 Дискусія 3: Гігієна після пандемії',a:'<b>Питання:</b> чи варто носити маски в людних місцях щозими?<br><b>За:</b> маски захищають вразливих людей, а гігієна зменшує кількість днів хвороби.<br><b>Особистий вибір:</b> кожен має вирішувати сам; постійні маски незручні.<br>Як змінились твої гігієнічні звички за кілька років? Яке найефективніше правило, щоб не хворіти взимку?',b:'',ph:'«носити маску» · «дезінфікувати руки» · «соціальна дистанція» · «захищати здоров’я»'}
];
const SPPTS=10,$=(s,e=document)=>e.querySelector(s);
let S={};try{S=JSON.parse(localStorage.getItem('u93')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('u93',JSON.stringify(S))}catch(e){}};
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[?.!]/g,'').replace(/\s+/g,' ').trim();
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function mkItem(id,i){
 const [q,a,o,w]=EX[id].items[i],key=id+i,el=document.createElement('div');let tries=0;
 el.className='item';
 el.innerHTML=`<div class="n">${i+1}</div><div class="b"><p class="q">${q.replace('___','<span class="blank"></span>')}</p><div class="ctl"></div><p class="fb"></p></div>`;
 const ctl=$('.ctl',el),fb=$('.fb',el);
 const show=(p,ok)=>{el.classList.add(ok?'ok':'bad');ctl.innerHTML='';fb.innerHTML=(ok?`✅ +${p} б. `:`❌ Правильна відповідь: <b>${a[0]}</b>. `)+(w||'')};
 if(S[key]!=null){show(S[key],S[key]>0);return el}
 const check=v=>{
  if(a.map(norm).includes(norm(v))){S[key]=tries?5:10;save();show(S[key],1);upd()}
  else if(tries++){S[key]=0;save();show(0,0);upd()}
  else fb.textContent='🤔 Не зовсім. Спробуй ще раз — за другу спробу 5 балів.';
 };
 if(o){shuf(o).forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{b.disabled=true;check(t)};ctl.append(b)})}
 else{const inp=document.createElement('input'),b=document.createElement('button');inp.placeholder='Твоя відповідь';inp.autocomplete='off';inp.setAttribute('aria-label','Відповідь');b.textContent='Перевірити';b.className='go';
  const go=()=>{if(inp.value.trim())check(inp.value)};b.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};ctl.append(inp,b)}
 return el;
}
function build(){
 const nav=$('#nav'),main=$('#main');nav.innerHTML='';main.innerHTML='';
 TABS.forEach((t,k)=>{
  const b=document.createElement('button');b.textContent=t.name;b.dataset.t=t.id;b.onclick=()=>open(t.id);nav.append(b);
  const p=document.createElement('section');p.className='panel';p.id='p-'+t.id;p.innerHTML=`<div class="intro">${t.intro}</div>`;
  t.ex.forEach(id=>{const e=EX[id],d=document.createElement('div');d.className='ex';d.id='ex-'+id;
   d.innerHTML=`<span class="sc"></span><h2>${e.t}</h2><p class="ins">${e.i}</p>`;
   e.items.forEach((_,i)=>d.append(mkItem(id,i)));p.append(d)});
  if(t.id==='speak')SP.forEach(s=>{const c=document.createElement('div');c.className='card';
   c.innerHTML=`<h3>${s.t}</h3><div class="who">${s.a}</div>${s.b?`<div class="who">${s.b}</div>`:''}<p class="ph">💬 Скажи англійською: ${s.ph}</p>${s.np?'<p class="np">Без балів, для практики</p>':`<label class="chk"><input type="checkbox" ${S[s.id]?'checked':''}> Ми це зробили (+${SPPTS} б.)</label>`}`;
   const ck=$('input',c);if(ck)ck.onchange=e=>{if(e.target.checked)S[s.id]=SPPTS;else delete S[s.id];save();upd()};p.append(c)});
  const nx=document.createElement('div');nx.className='next';
  if(TABS[k+1]){const nb=document.createElement('button');nb.textContent='Далі: '+TABS[k+1].name+' →';nb.onclick=()=>open(TABS[k+1].id);nx.append(nb)}else nx.textContent='🎉 Це був останній розділ. Молодець!';
  p.append(nx);main.append(p)});
 open(TABS[0].id);upd();
}
function open(id){document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===id));scrollTo(0,0)}
function upd(){
 let tot=0,max=0;
 TABS.forEach(t=>{let done=true;
  t.ex.forEach(id=>{const n=EX[id].items.length;let s=0,c=0;for(let i=0;i<n;i++){if(S[id+i]!=null){s+=S[id+i];c++}}
   tot+=s;max+=n*10;if(c<n)done=false;$('#ex-'+id+' .sc').textContent=`${s} / ${n*10}`});
  if(t.id==='speak'){SP.filter(s=>!s.np).forEach(s=>{max+=SPPTS;if(S[s.id])tot+=SPPTS;else done=false})}
  $(`nav button[data-t="${t.id}"]`).classList.toggle('full',done)});
 $('#pts').textContent=tot;$('#max').textContent=max;$('#fill').style.width=(max?tot/max*100:0)+'%';
 const r=max?tot/max:0;$('#rank').textContent=r>=.9?'🏆 Майстер шопінгу':r>=.7?'🥇 Чудово!':r>=.4?'🥈 Гарний прогрес':r>0?'🌱 Початок є':'';
}
$('#reset').onclick=()=>{if(confirm('Скинути всі бали й відповіді?')){S={};save();build()}};
build();
</script>
</body>
</html>
